[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-recovery"
version = "0.1.0"
description = "Safe recovery from corrupted robot experience under incomplete provenance"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Venkat Margapuri"}]
dependencies = ["numpy==2.2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
